<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firmo</title>
<meta name="description" content="Firmo – أدوات زراعية: مساحة البيفوت، تجربة الري، فحص التقاوي، متابعة الإنبات، تجربة الحصاد، فحص البيفوت">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Firmo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f3f5ee;--bar:#fff;--ink:#1d2a1a;--mut:#667262;--line:#d9dfd0;--g:#2f6b2f;--g2:#e4efd9;--dan:#b3402a;color-scheme:light}
:root[data-theme="dark"]{--bg:#161b14;--bar:#202719;--ink:#eef2e8;--mut:#9aa693;--line:#35402e;--g:#6fbf62;--g2:#2a3622;--dan:#ff9a82;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
#views{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
header{display:flex;align-items:center;gap:6px;background:var(--bar);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;min-height:46px}
header b{color:var(--g);font-size:15px;white-space:nowrap}
#tool{flex:1;min-width:0;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tool::before{content:"· ";}
.ib{border:1px solid var(--line);background:var(--g2);color:var(--g);font:inherit;font-size:15px;font-weight:700;border-radius:10px;min-width:38px;height:36px;padding:0 8px;cursor:pointer;line-height:1}
.ib:focus-visible,nav button:focus-visible,.hb:focus-visible{outline:2px solid var(--g);outline-offset:1px}
#bstrow{display:none;background:var(--g2);color:var(--ink);font-size:12px;padding:5px 12px;border-bottom:1px solid var(--line)}
#bstrow.warn{color:var(--dan);font-weight:700}
nav{display:flex;background:var(--bar);border-top:1px solid var(--line)}
footer#cr{background:var(--bar);text-align:center;font-size:10.5px;line-height:1.2;padding:3px 8px calc(4px + env(safe-area-inset-bottom,0px));color:var(--mut)}
footer#cr a{color:var(--mut);text-decoration:none;direction:ltr;unicode-bidi:isolate}
footer#cr a:hover,footer#cr a:focus-visible{color:var(--g);text-decoration:underline}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);font:inherit;font-size:10.5px;padding:8px 1px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid transparent}
nav button .i{font-size:22px;line-height:1}
nav button .nl{max-width:100%;overflow:hidden;line-height:1.15;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
nav button.on{color:var(--g);background:var(--g2);border-top-color:var(--g);font-weight:700}
@media(min-width:720px){header{order:-3}#bstrow{order:-2}nav{order:-1;border-top:0;border-bottom:1px solid var(--line)}nav button{flex-direction:row;justify-content:center;gap:8px;font-size:15px;padding:12px;border-top:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--g)}}
.hb{border:1px solid var(--line);background:var(--g2);color:var(--g);font:inherit;font-size:14px;font-weight:700;border-radius:10px;padding:11px;cursor:pointer;text-align:center}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#dlg.on{display:flex}
#dlg .bx{background:var(--bar);color:var(--ink);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
#dlg h2{margin:0 0 8px;font-size:17px;color:var(--g)}
#dlg p{margin:6px 0;font-size:13px;color:var(--mut);line-height:1.7}
#dlg .row{display:flex;flex-direction:column;gap:8px;margin:12px 0}
#dlg .cl{background:none;color:var(--mut)}
#msg{font-size:13px;min-height:18px;color:var(--g);font-weight:700}
</style>
</head>
<body>
<header>
<b id="brand" style="cursor:pointer;display:flex;align-items:center;gap:6px" title="About Firmo">
<img src="icons/favicon-32.png" alt="Firmo" style="width:28px;height:28px;border-radius:6px;vertical-align:middle">
<span>Firmo</span>
</b><span id="tool"></span>
<button class="ib" id="ibtn" hidden aria-label="Install" title="Install">📲</button>
<button class="ib" id="bbtn" aria-label="Backup">💾</button>
<button class="ib" id="tbtn" aria-label="Theme">🌙</button>
<button class="ib" id="lbtn" aria-label="Language">EN</button>
</header>
<div id="bstrow"></div>
<div id="views"></div>
<div id="dlg"><div class="bx">
<h2 data-t="d_title"></h2>
<p id="info"></p>
<p id="inst" data-t="d_ios" hidden></p>
<div class="row">
<button class="hb" id="bx" data-t="d_save"></button>
<button class="hb" id="br" data-t="d_restore"></button>
<input type="file" id="bf" accept=".json,application/json" hidden>
<button class="hb cl" id="bc" data-t="d_close"></button>
</div>
<div id="msg"></div>
</div></div>
<div id="about" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:10">
<div style="background:#fff;color:#1a1a1a;border-radius:16px;padding:18px 16px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.25)">
<div style="text-align:center;margin-bottom:14px">
<img id="about-logo" src="icons/logo.webp" alt="Firmo" style="width:140px;height:auto;border-radius:16px;box-shadow:0 3px 12px rgba(0,0,0,.18)">
</div>
<h2 id="about-title" style="text-align:center;color:#2f6b2f;margin:0 0 12px;font-size:17px;font-weight:700"></h2>
<div id="about-body" style="font-size:13.5px;line-height:1.8;color:#1a1a1a"></div>
<button class="hb" id="about-close" style="margin-top:16px;width:100%;background:#e4efd9;color:#2f6b2f;border:1px solid #d9dfd0;font-weight:700" data-t="d_close"></button>
</div></div>
<nav id="tabs" role="tablist">
<button data-k="pivot" role="tab"><span class="i">📐</span><span class="nl" data-t="t_pivot"></span></button>
<button data-k="irrig" role="tab"><span class="i">💧</span><span class="nl" data-t="t_irrig"></span></button>
<button data-k="seed" role="tab"><span class="i">🥔</span><span class="nl" data-t="t_seed"></span></button>
<button data-k="sprout" role="tab"><span class="i">🌱</span><span class="nl" data-t="t_sprout"></span></button>
<button data-k="harvest" role="tab"><span class="i">🚜</span><span class="nl" data-t="t_harvest"></span></button>
<button data-k="inspect" role="tab"><span class="i">🔍</span><span class="nl" data-t="t_inspect"></span></button>
</nav>

in-bottom: 18px;\n    transition: background 0.25s;\n  }\n  .card h2 {\n    font-size: 1.1rem; margin-bottom: 14px;\n    color: var(--primary-dark);\n    border-bottom: 2px solid var(--primary); padding-bottom: 5px;\n  }\n  .form-group {\n    display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;\n  }\n  .form-group label { font-weight: 600; font-size: 0.95rem; }\n  .form-group input, .form-group select {\n    padding: 11px 14px; border: 1.5px solid var(--border);\n    border-radius: 8px; font-size: 1.05rem; text-align: center;\n    background: var(--input-bg); color: var(--text);\n  }\n  .form-group input:focus, .form-group select:focus {\n    outline: none; border-color: var(--primary);\n    box-shadow: 0 0 0 3px rgba(13,110,253,0.2);\n  }\n  .result-box {\n    background: var(--info-bg); border-radius: 10px;\n    padding: 14px; text-align: center; margin-top: 8px;\n  }\n  .result-box .label { font-size: 0.85rem; color: var(--text-muted); }\n  .result-box .value {\n    font-size: 1.4rem; font-weight: 700; color: var(--primary-dark);\n  }\n  .info-row {\n    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px;\n  }\n  @media (max-width: 500px) { .info-row { grid-template-columns: 1fr 1fr; } }\n  .info-box {\n    background: var(--info-box); border-radius: 8px; padding: 10px; text-align: center;\n  }\n  .info-box .label { font-size: 0.8rem; color: var(--text-muted); }\n  .info-box .value { font-size: 1.05rem; font-weight: 600; color: var(--text); }\n  table { width: 100%; border-collapse: collapse; margin-top: 6px; }\n  th, td {\n    border: 1px solid var(--border); padding: 12px 8px;\n    text-align: center; font-size: 1rem;\n  }\n  th { background: var(--primary); color: #fff; font-weight: 600; }\n  tr:nth-child(even) { background: var(--info-box); }\n  td input {\n    width: 100px; padding: 8px; border: 1.5px solid var(--border);\n    border-radius: 6px; text-align: center; font-size: 1.05rem;\n    background: var(--input-bg); color: var(--text);\n  }\n  td input:focus { outline: none; border-color: var(--primary); }\n  .total-row { background: var(--total-bg) !important; font-weight: 700; }\n  .total-row td { border-top: 2.5px solid var(--success); font-size: 1.1rem; }\n  .note {\n    margin-top: 12px; font-size: 0.82rem;\n    color: var(--text-muted); text-align: center;\n  }\n  .btn-row {\n    display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;\n  }\n  button.action {\n    padding: 9px 16px; border: none; border-radius: 8px;\n    font-size: 0.9rem; font-weight: 600; cursor: pointer;\n  }\n  .btn-success { background: var(--success); color: #fff; }\n  .btn-success:hover { opacity: 0.9; }\n  .btn-secondary { background: #6c757d; color: #fff; }\n  .btn-secondary:hover { opacity: 0.9; }\n  .btn-primary { background: var(--primary); color: #fff; }\n  .btn-primary:hover { opacity: 0.9; }\n  .wheel-last { background: var(--last-bg) !important; }\n  .hidden { display: none !important; }\n  .footer {\n    text-align: center;\n    margin-top: 24px;\n    padding: 16px 12px;\n    font-size: 0.85rem;\n    color: var(--text-muted);\n    border-top: 1px solid var(--border);\n    line-height: 1.7;\n  }\n  .footer strong { color: var(--primary-dark); }\n  /* Custom panel */\n  #customPanel .custom-grid {\n    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\n  }\n  @media (max-width: 400px) { #customPanel .custom-grid { grid-template-columns: 1fr; } }\n  #customPanel .custom-item {\n    display: flex; align-items: center; gap: 8px;\n    background: var(--info-box); border-radius: 8px; padding: 10px 12px;\n  }\n  #customPanel .custom-item label {\n    font-weight: 600; min-width: 70px; font-size: 0.9rem; flex-shrink: 0;\n  }\n  #customPanel .custom-item input {\n    flex: 1; padding: 8px; border: 1.5px solid var(--border);\n    border-radius: 6px; text-align: center; font-size: 1.05rem;\n    background: var(--input-bg); color: var(--text); min-width: 0;\n  }\n  #customPanel .custom-item .unit {\n    font-size: 0.8rem; color: var(--text-muted); min-width: 28px;\n  }\n  input, td, .value { font-variant-numeric: lining-nums; }\n  td, .result-box .value, .info-box .value { direction: ltr; unicode-bidi: plaintext; }\n  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; backdrop-filter: blur(4px); }\n  .modal-overlay.active { display: flex; }\n  .modal { background: var(--card); color: var(--text); border-radius: 16px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); border: 1px solid var(--border); }\n  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }\n  .modal-header h2 { font-size: 1.1rem; color: var(--primary-dark); border: none; margin: 0; padding: 0; }\n  .modal-body { padding: 18px; }\n  .modal-body p { margin-bottom: 10px; color: var(--text-muted); font-size: 0.92rem; }\n  .modal-body ul { padding-inline-start: 20px; margin-bottom: 12px; color: var(--text-muted); font-size: 0.9rem; }\n  .modal-body li { margin-bottom: 4px; }\n  .close-btn { width: 34px; height: 34px; border: none; background: var(--info-box); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-size: 1.2rem; }\n  .close-btn:hover { background: #dc3545; color: #fff; }\n<\/style>\n<style id=\"ts-unify\">\n:root{--ts-bg:#f3f5ee;--ts-card:#ffffff;--ts-ink:#1d2a1a;--ts-mut:#667262;--ts-line:#d9dfd0;--ts-pri:#2f6b2f;--ts-pri2:#e4efd9;--ts-dan:#b3402a;--ts-input:#ffffff;--ts-track:#e9ede6;--ts-on:#ffffff;color-scheme:light}\n:root[data-theme=\"dark\"]{--ts-bg:#161b14;--ts-card:#202719;--ts-ink:#eef2e8;--ts-mut:#9aa693;--ts-line:#35402e;--ts-pri:#4a9a42;--ts-pri2:#2a3622;--ts-dan:#ff9a82;--ts-input:#161b14;--ts-track:#2a342b;--ts-on:#ffffff;color-scheme:dark}\n*,*::before,*::after{box-sizing:border-box}\nhtml{background:var(--ts-bg)!important}\nbody{background:var(--ts-bg)!important;color:var(--ts-ink)!important;font-family:Tahoma,\"Segoe UI\",Arial,sans-serif!important;font-size:15px!important;line-height:1.55!important;max-width:900px!important;margin:0 auto!important;padding:12px 12px 28px!important;min-height:0!important}\nh1{font-size:19px!important;font-weight:700!important;color:var(--ts-pri)!important;margin:2px 0 12px!important;text-align:start!important;display:flex!important;align-items:center;justify-content:flex-start!important;gap:8px}\nh2{font-size:16px!important;font-weight:700!important;color:var(--ts-pri)!important;margin:0 0 10px!important;text-align:start;border:0!important;padding:0!important}\n.card{background:var(--ts-card)!important;border:1px solid var(--ts-line)!important;border-radius:12px!important;padding:14px!important;margin:0 0 12px!important;box-shadow:none!important}\nlabel{font-size:12px!important;color:var(--ts-mut)!important;font-weight:400!important}\ninput:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),select,textarea{font-family:inherit!important;border:1px solid var(--ts-line)!important;border-radius:8px!important;background:var(--ts-input)!important;color:var(--ts-ink)!important}\ninput:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ts-pri)!important;outline-offset:1px!important}\nbutton{font-family:inherit!important;border-radius:10px!important;cursor:pointer}\ntable{border-collapse:collapse}\nth{background:var(--ts-pri2)!important;color:var(--ts-ink)!important}\nth,td{border-color:var(--ts-line)!important}\n.note,.sub,.subtitle{color:var(--ts-mut)!important}\n.sub,.subtitle{font-size:13px!important;margin:-6px 0 12px!important;text-align:start!important}\n@media print{html,body{background:#fff!important;color:#000!important}}\n:root:root:root{--primary:var(--ts-pri);--primary-dark:var(--ts-pri);--success:var(--ts-pri);--bg:var(--ts-bg);--card:var(--ts-card);--border:var(--ts-line);--text:var(--ts-ink);--text-muted:var(--ts-mut);--info-bg:var(--ts-pri2);--info-box:var(--ts-track);--input-bg:var(--ts-input)}.container{max-width:none!important;margin:0!important}body{padding:12px 12px 28px!important}.top-btns{justify-content:flex-end}#langBtn,#themeBtn{display:none!important}.logo-icon{background:var(--ts-pri)!important;box-shadow:none!important}h1{font-size:19px!important}.card{box-shadow:none!important}th{background:var(--ts-pri)!important;color:#fff!important}.btn-primary,.btn-success{background:var(--ts-pri)!important;color:var(--ts-on)!important;border:1px solid var(--ts-pri)!important}.btn-secondary{background:transparent!important;color:var(--ts-pri)!important;border:1px solid var(--ts-pri)!important}.icon-btn{background:var(--ts-pri)!important;color:#fff!important}input,select{background:var(--ts-input)!important}.form-group input:focus,.form-group select:focus{box-shadow:none!important}<\/style>\n<\/head>\n<body>\n<div class=\"container\">\n  <div class=\"top-btns\">\n    <button class=\"icon-btn\" id=\"verseBtn\" onclick=\"showVerse()\" title=\"آية كريمة\">📖<\/button>\n    <button class=\"icon-btn\" id=\"langBtn\" onclick=\"toggleLang()\" title=\"Language\">ع<\/button>\n    <button class=\"icon-btn\" id=\"themeBtn\" onclick=\"toggleTheme()\" title=\"Theme\">🌙<\/button>\n  <\/div>\n\n  <!-- ===== MAIN VIEW ===== -->\n  <div id=\"mainView\">\n    <h1><span class=\"logo-icon\" onclick=\"showInfo()\" role=\"button\" title=\"About / فكرة البرنامج\"><svg viewBox=\"0 0 48 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"24\" r=\"20\" stroke=\"white\" stroke-width=\"2.5\" fill=\"none\"/>\n      <circle cx=\"24\" cy=\"24\" r=\"4\" fill=\"#ffeb3b\"/>\n      <line x1=\"24\" y1=\"24\" x2=\"42\" y2=\"24\" stroke=\"white\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n      <circle cx=\"32\" cy=\"24\" r=\"2.5\" fill=\"#ffeb3b\"/><circle cx=\"38\" cy=\"24\" r=\"2.5\" fill=\"#ffeb3b\"/>\n      <line x1=\"24\" y1=\"24\" x2=\"30\" y2=\"12\" stroke=\"white\" stroke-width=\"1.5\" opacity=\"0.6\"/>\n      <line x1=\"24\" y1=\"24\" x2=\"30\" y2=\"36\" stroke=\"white\" stroke-width=\"1.5\" opacity=\"0.6\"/><\/svg><\/span><span id=\"t-title\">Pivot Area Calculator<\/span><\/h1>\n    <p class=\"subtitle\" id=\"t-subtitle\">Tracks per wheel = Common tower length ÷ Span width<\/p>\n\n    <div class=\"card\">\n      <h2 id=\"t-inputs\">📌 Inputs<\/h2>\n\n      <div class=\"form-group\">\n        <label for=\"pivotBrand\" id=\"t-brand\">Pivot Brand<\/label>\n        <div style=\"display:flex;gap:8px;align-items:stretch\"><select id=\"pivotBrand\" onchange=\"onBrandChange()\">\n          <option value=\"valley\" data-length=\"52\" data-en=\"Valley — 52 m (170 ft)\" data-ar=\"ڤالي — 52 م (170 قدم)\">Valley — 52 m (170 ft)<\/option>\n          <option value=\"zimmatic\" data-length=\"54\" data-en=\"Zimmatic — 54 m (178 ft)\" data-ar=\"زيماتيك — 54 م (178 قدم)\" selected>Zimmatic — 54 m (178 ft)<\/option>\n          <option value=\"western\" data-length=\"55\" data-en=\"Western — 55 m\" data-ar=\"ويستيرن — 55 م\">Western — 55 m<\/option>\n          <option value=\"custom\" data-length=\"0\" data-en=\"Other (Custom tracks)\" data-ar=\"اختيار آخر (جرر مخصص)\">Other (Custom tracks)<\/option>\n        <\/select>\n        <button class=\"action btn-secondary hidden\" id=\"editBrandBtn\" onclick=\"editSavedBrand()\" title=\"Edit / تعديل\" style=\"padding:0 14px\">✏️<\/button><\/div>\n      <\/div>\n\n      <div class=\"form-group\">\n        <label for=\"pivotArea\" id=\"t-area\">Pivot Area (Feddan)<\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"pivotArea\" value=\"125\" min=\"1\" step=\"0.01\" oninput=\"fixDigits(this);recalculate()\">\n      <\/div>\n\n      <div class=\"form-group\" id=\"spanWidthGroup\">\n        <label for=\"spanWidth\" id=\"t-spanwidth\">Track Width (m)<\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"spanWidth\" value=\"1.8\" min=\"0.1\" step=\"0.01\" oninput=\"fixDigits(this);recalculate()\">\n      <\/div>\n\n      <div class=\"result-box\">\n        <div class=\"label\" id=\"t-totalspans\">Total Tracks for Half Pivot<\/div>\n        <div class=\"value\" id=\"totalSpansOut\">—<\/div>\n      <\/div>\n\n      <div class=\"info-row\">\n        <div class=\"info-box\">\n          <div class=\"label\" id=\"t-radius\">Radius (m)<\/div>\n          <div class=\"value\" id=\"radiusOut\">—<\/div>\n        <\/div>\n        <div class=\"info-box\" id=\"towerBox\">\n          <div class=\"label\" id=\"t-tower\">Tower Length (m)<\/div>\n          <div class=\"value\" id=\"towerLenOut\">—<\/div>\n        <\/div>\n        <div class=\"info-box\">\n          <div class=\"label\" id=\"t-spansper\">Tracks per Wheel<\/div>\n          <div class=\"value\" id=\"spansPerWheelOut\">—<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2 id=\"t-perwheel\">📋 Area per Wheel<\/h2>\n      <div class=\"btn-row\">\n        <button class=\"action btn-success\" id=\"t-autofill\" onclick=\"autoFill()\">⚡ Auto-fill<\/button>\n        <button class=\"action btn-secondary\" id=\"t-clear\" onclick=\"clearInputs()\">🗑️ Clear<\/button>\n      <\/div>\n      <table>\n        <thead>\n          <tr>\n            <th id=\"t-col-wheel\">Wheel #<\/th>\n            <th id=\"t-col-spans\">Number of tracks<\/th>\n            <th id=\"t-col-area\">Wheel Area (Feddan)<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"tableBody\"><\/tbody>\n        <tfoot>\n          <tr class=\"total-row\">\n            <td id=\"t-total\">Total<\/td>\n            <td id=\"sumSpans\">0<\/td>\n            <td id=\"sumArea\">0<\/td>\n          <\/tr>\n        <\/tfoot>\n      <\/table>\n      <p class=\"note\" id=\"t-note\">\n        Tracks/wheel = Common tower length ÷ Span width<br>\n        Last wheel takes the remaining tracks from total area\n      <\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2 data-pl=\"plant\"><\/h2>\n      <div class=\"form-group\"><label for=\"plW\" data-pl=\"plw\"><\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"plW\" oninput=\"fixDigits(this);plCalc()\"><\/div>\n      <div class=\"form-group\"><label for=\"plN\" data-pl=\"pln\"><\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"plN\" oninput=\"fixDigits(this);plCalc()\"><\/div>\n      <div class=\"result-box\"><div class=\"label\" data-pl=\"plseed\"><\/div><div class=\"value\" id=\"plSeed\">—<\/div><\/div>\n      <div class=\"result-box\" style=\"margin-top:8px\"><div class=\"label\" data-pl=\"plrate\"><\/div><div class=\"value\" id=\"plRate\">—<\/div><\/div>\n      <p class=\"note\" data-pl=\"plnote\"><\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2 data-pl=\"harv\"><\/h2>\n      <div class=\"form-group\"><label for=\"hvN\" data-pl=\"hvn\"><\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"hvN\" oninput=\"fixDigits(this);plCalc()\"><\/div>\n      <div class=\"result-box\"><div class=\"label\" data-pl=\"hvrate\"><\/div><div class=\"value\" id=\"hvRate\">—<\/div><\/div>\n      <p class=\"note\" data-pl=\"hvnote\"><\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2 data-pl=\"needp\"><\/h2>\n      <div class=\"form-group\"><label for=\"npR\" data-pl=\"npr\"><\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"npR\" oninput=\"fixDigits(this);plCalc()\"><\/div>\n      <div class=\"form-group\"><label for=\"npA\" data-pl=\"npa\"><\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"npA\" oninput=\"fixDigits(this);plCalc()\"><\/div>\n      <div class=\"result-box\"><div class=\"label\" data-pl=\"npseed\"><\/div><div class=\"value\" id=\"npSeed\">—<\/div><\/div>\n      <p class=\"note\" data-pl=\"npnote\"><\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2 data-pl=\"needh\"><\/h2>\n      <div class=\"form-group\"><label for=\"nhL\" data-pl=\"nhl\"><\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"nhL\" oninput=\"fixDigits(this);plCalc()\"><\/div>\n      <div class=\"form-group\"><label for=\"nhA\" data-pl=\"nha\"><\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"nhA\" oninput=\"fixDigits(this);haM=this.value.trim()!=='';plCalc()\">\n        <p class=\"note\" id=\"nhAs\" style=\"margin:4px 0 0\"><\/p><\/div>\n      <div class=\"form-group\"><label for=\"nhR\" data-pl=\"nhr\"><\/label>\n        <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"nhR\" oninput=\"fixDigits(this);hrM=this.value.trim()!=='';plCalc()\">\n        <p class=\"note\" id=\"nhRs\" style=\"margin:4px 0 0\"><\/p><\/div>\n      <div class=\"result-box\"><div class=\"label\" data-pl=\"nhj\"><\/div><div class=\"value\" id=\"nhJ\">—<\/div><\/div>\n      <div class=\"result-box\" style=\"margin-top:8px\"><div class=\"label\" data-pl=\"nht\"><\/div><div class=\"value\" id=\"nhT\">—<\/div><\/div>\n      <p class=\"note\" data-pl=\"nhnote\"><\/p>\n    <\/div>\n  <\/div>\n\n  <!-- ===== CUSTOM SPANS PANEL ===== -->\n  <div id=\"customPanel\" class=\"hidden\">\n    <h1><span class=\"logo-icon\" onclick=\"showInfo()\" role=\"button\" title=\"About / فكرة البرنامج\"><svg viewBox=\"0 0 48 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"24\" r=\"20\" stroke=\"white\" stroke-width=\"2.5\" fill=\"none\"/>\n      <circle cx=\"24\" cy=\"24\" r=\"4\" fill=\"#ffeb3b\"/>\n      <line x1=\"24\" y1=\"24\" x2=\"42\" y2=\"24\" stroke=\"white\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n      <circle cx=\"32\" cy=\"24\" r=\"2.5\" fill=\"#ffeb3b\"/><circle cx=\"38\" cy=\"24\" r=\"2.5\" fill=\"#ffeb3b\"/>\n      <line x1=\"24\" y1=\"24\" x2=\"30\" y2=\"12\" stroke=\"white\" stroke-width=\"1.5\" opacity=\"0.6\"/>\n      <line x1=\"24\" y1=\"24\" x2=\"30\" y2=\"36\" stroke=\"white\" stroke-width=\"1.5\" opacity=\"0.6\"/><\/svg><\/span><span id=\"t-custom-title\">Custom Tracks per Wheel<\/span><\/h1>\n    <p class=\"subtitle\" id=\"t-custom-sub\">Enter tracks or tower length for each wheel<\/p>\n\n    <div class=\"card\">\n      <h2 id=\"t-custom-h2\">Tracks / Tower length per wheel<\/h2>\n\n      <div class=\"form-group\" style=\"margin-bottom:14px;\">\n        <label id=\"t-custom-name\">Brand name<\/label>\n        <input type=\"text\" id=\"customName\" maxlength=\"30\" style=\"text-align:center\">\n      <\/div>\n\n      <div class=\"form-group\" style=\"margin-bottom:14px;\">\n        <label id=\"t-custom-mode\">Input mode<\/label>\n        <select id=\"customMode\" onchange=\"onCustomModeChange()\">\n          <option value=\"spans\" data-en=\"Number of tracks\" data-ar=\"عدد الجرر\">Number of tracks<\/option>\n          <option value=\"length\" data-en=\"Tower length (m)\" data-ar=\"طول البرج (متر)\">Tower length (m)<\/option>\n        <\/select>\n      <\/div>\n\n      <div class=\"custom-grid\" id=\"customGrid\"><\/div>\n      <div class=\"btn-row\" style=\"margin-top:16px;\">\n        <button class=\"action btn-success\" id=\"t-custom-autofill\" onclick=\"autoFillCustom()\">Auto-fill<\/button>\n        <button class=\"action btn-secondary\" id=\"t-custom-clear\" onclick=\"clearCustom()\">Clear<\/button>\n        <button class=\"action btn-primary\" id=\"t-custom-save\" onclick=\"saveCustomSpans()\">Save &amp; Return<\/button>\n        <button class=\"action btn-secondary hidden\" id=\"deleteBrandBtn\" onclick=\"deleteSavedBrand()\" style=\"background:#dc3545\">🗑️ Delete<\/button>\n        <button class=\"action btn-secondary\" id=\"t-custom-cancel\" onclick=\"cancelCustom()\">Cancel<\/button>\n      <\/div>\n      <p class=\"note\" id=\"t-custom-note\">Enter free values for each wheel based on different tower lengths.<\/p>\n    <\/div>\n  <\/div>\n\n  <!-- Warning modal -->\n<div class=\"modal-overlay\" id=\"warnModal\" onclick=\"if(event.target===this)closeWarn()\" style=\"z-index:1100\">\n  <div class=\"modal\" style=\"max-width:380px\">\n    <div class=\"modal-header\"><h2 id=\"warnTitle\" style=\"color:#dc3545\">⚠️<\/h2><button class=\"close-btn\" onclick=\"closeWarn()\">×<\/button><\/div>\n    <div class=\"modal-body\" style=\"text-align:center\">\n      <p id=\"warnMsg\" style=\"font-size:1.05rem; color:var(--text); font-weight:600; margin-bottom:16px\"><\/p>\n      <button class=\"action btn-primary\" id=\"warnOk\" onclick=\"closeWarn()\" style=\"min-width:120px\"><\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- Info modal (logo) -->\n<div class=\"modal-overlay\" id=\"infoModal\" onclick=\"if(event.target===this)closeInfo()\">\n  <div class=\"modal\">\n    <div class=\"modal-header\"><h2 id=\"infoTitle\">💡<\/h2><button class=\"close-btn\" onclick=\"closeInfo()\">×<\/button><\/div>\n    <div class=\"modal-body\" id=\"infoBody\"><\/div>\n  <\/div>\n<\/div>\n\n<!-- Verse modal -->\n<div class=\"modal-overlay\" id=\"verseModal\" onclick=\"if(event.target===this)closeVerse()\">\n  <div class=\"modal\" style=\"max-width:420px\">\n    <div class=\"modal-header\"><h2 style=\"font-size:1rem\">📖 آية كريمة<\/h2><button class=\"close-btn\" onclick=\"closeVerse()\">×<\/button><\/div>\n    <div class=\"modal-body\" dir=\"rtl\" style=\"text-align:center; padding:28px 22px\">\n      <p style=\"font-size:1.05rem; color:var(--primary-dark); margin-bottom:18px; font-weight:600\">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<\/p>\n      <p style=\"font-size:1.25rem; line-height:2.1; color:var(--text); font-family:'Amiri','Scheherazade New','Traditional Arabic','Segoe UI',Tahoma,serif; margin-bottom:20px\">\n        فَأَمَّا الزَّبَدُ فَيَذْهَبُ جُفَاءً ۖ وَأَمَّا مَا يَنفَعُ النَّاسَ فَيَمْكُثُ فِي الْأَرْضِ\n      <\/p>\n      <p style=\"font-size:0.95rem; margin-top:8px\">صدق الله العظيم<\/p>\n      <p style=\"font-size:0.78rem; margin-top:12px; opacity:0.8\">سورة الرعد — الآية 17<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"footer\" id=\"t-footer\">\n    <div id=\"t-footer-design\"><strong>Design:<\/strong> Eng. Mohamed Ibrahim (Fermineo)<\/div>\n    <div id=\"t-footer-eq\">Equations based on the Biro equation<\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst PI = Math.PI;\n\n// ===== Always English (Latin) digits, whatever the language =====\nfunction toLatin(str) {\n  return String(str)\n    .replace(/[\\u0660-\\u0669]/g, d => d.charCodeAt(0) - 0x0660)\n    .replace(/[\\u06F0-\\u06F9]/g, d => d.charCodeAt(0) - 0x06F0)\n    .replace(/[\\u066B\\u060C]/g, '.')\n    .replace(/\\u066C/g, '');\n}\nfunction num(v) { return parseFloat(toLatin(v)); }\nfunction fixDigits(el) {\n  const v = toLatin(el.value);\n  if (v !== el.value) el.value = v;\n}\nconst NUM_WHEELS = 9;\n\n// Custom spans array (null = not using custom)\nlet customSpansPerWheel = null; // array of numbers, length NUM_WHEELS\n\nconst i18n = {\n  en: {\n    dir: 'ltr', lang: 'en', btn: 'ع',\n    title: 'Pivot Area Calculator',\n    subtitle: 'Tracks per wheel = Common tower length ÷ Track width',\n    inputs: '📌 Inputs',\n    brand: 'Pivot Brand',\n    area: 'Pivot Area (Feddan)',\n    spanwidth: 'Track Width (m)',\n    totalspans: '📊 Total Tracks for Half Pivot',\n    radius: 'Radius (m)',\n    tower: 'Tower Length (m)',\n    spansper: 'Tracks per Wheel',\n    perwheel: '📋 Area per Wheel',\n    autofill: '⚡ Auto-fill',\n    clear: '🗑️ Clear',\n    colWheel: 'Wheel #',\n    colSpans: 'Number of tracks',\n    colArea: 'Wheel Area (Feddan)',\n    total: 'Total',\n    note: 'Tracks/wheel = Common tower length ÷ Track width<br>Last wheel takes the remaining tracks from total area',\n    wheel: 'Wheel',\n    alertMax: 'Wheel {n}: maximum tracks is {m}',\n    warnTitle: '⚠️ Warning',\n    warnOk: 'OK',\n    customTitle: 'Custom Tracks per Wheel',\n    customSub: 'Enter tracks or tower length for each wheel',\n    customH2: '⚙️ Tracks / Tower length per wheel',\n    customSave: '💾 Save & Return',\n    customCancel: 'Cancel',\n    customNote: 'Uses main page data (area, total tracks, radius, track width). Auto-fill uses 54 m tower length. Last wheel = remaining from half pivot.',\n    customMode: 'Input mode',\n    customName: 'Brand name',\n    defaultBrandName: 'My brand',\n    deleteBrand: '🗑️ Delete',\n    confirmDelete: 'Delete this brand?',\n    customAutofill: '⚡ Auto-fill',\n    customClear: '🗑️ Clear',\n    alertRemaining: 'Last wheel must be the remaining value: {v}',\n    footerDesign: '<strong>Design:<\/strong> Eng. Mohamed Ibrahim (Fermineo)',\n    footerEq: 'Equations based on the Biro equation'\n  },\n  ar: {\n    dir: 'rtl', lang: 'ar', btn: 'EN',\n    title: 'حاسبة مساحة البيفوت',\n    subtitle: 'عدد الجرر لكل عجلة = الطول الشائع للبرج ÷ عرض الجرة',\n    inputs: '📌 المدخلات',\n    brand: 'البيفوت (الماركة)',\n    area: 'مساحة البيفوت (فدان)',\n    spanwidth: 'عرض الجرة (متر)',\n    totalspans: '📊 إجمالي عدد الجرر لنصف البيفوت',\n    radius: 'نصف القطر (متر)',\n    tower: 'طول البرج (متر)',\n    spansper: 'عدد الجرر لكل عجلة',\n    perwheel: '📋 مساحة كل عجلة',\n    autofill: '⚡ تعبئة تلقائية',\n    clear: '🗑️ مسح',\n    colWheel: 'رقم العجلة',\n    colSpans: 'عدد الجرر',\n    colArea: 'مساحة العجلة (فدان)',\n    total: 'الإجمالي',\n    note: 'عدد الجرر/عجلة = الطول الشائع للبرج ÷ عرض الجرة<br>العجلة الأخيرة تأخذ الباقي من إجمالي المساحة',\n    wheel: 'العجلة',\n    alertMax: 'العجلة {n}: الحد الأقصى لعدد الجرر هو {m}',\n    warnTitle: '⚠️ تنبيه',\n    warnOk: 'حسناً',\n    customTitle: 'عدد الجرر المخصص لكل عجلة',\n    customSub: 'أدخل عدد الجرر أو طول البرج لكل عجلة',\n    customH2: '⚙️ عدد الجرر / طول البرج لكل عجلة',\n    customSave: '💾 حفظ والرجوع',\n    customCancel: 'إلغاء',\n    customNote: 'تعتمد على بيانات الصفحة الرئيسية (المساحة، إجمالي الجرر، نصف القطر، عرض الجرة). التعبئة التلقائية بطول برج 54 م. العجلة الأخيرة = المتبقي من نصف البيفوت.',\n    customMode: 'طريقة الإدخال',\n    customName: 'اسم الماركة',\n    defaultBrandName: 'ماركتي',\n    deleteBrand: '🗑️ حذف الماركة',\n    confirmDelete: 'حذف هذه الماركة؟',\n    customAutofill: '⚡ تعبئة تلقائية',\n    customClear: '🗑️ مسح',\n    alertRemaining: 'العجلة الأخيرة يجب أن تكون القيمة المتبقية: {v}',\n    footerDesign: '<strong>تصميم:<\/strong> مهندس محمد إبراهيم (فرمينيو)',\n    footerEq: 'المعادلات مبنية على معادلة بيرو'\n  }\n};\n\nlet currentLang = 'en';\nlet currentTheme = 'light';\ntry { currentTheme = localStorage.getItem('pivot-theme') || 'light'; } catch (e) {}\n\nfunction toggleLang() {\n  currentLang = currentLang === 'en' ? 'ar' : 'en';\n  applyLang();\n  recalculate();\n}\n\nfunction toggleTheme() {\n  currentTheme = currentTheme === 'light' ? 'dark' : 'light';\n  applyTheme();\n}\n\nfunction applyTheme() {\n  if (currentTheme === 'dark') {\n    document.documentElement.setAttribute('data-theme', 'dark');\n    document.getElementById('themeBtn').textContent = '☀️';\n    document.getElementById('themeBtn').title = 'Light mode';\n  } else {\n    document.documentElement.removeAttribute('data-theme');\n    document.getElementById('themeBtn').textContent = '🌙';\n    document.getElementById('themeBtn').title = 'Dark mode';\n  }\n  try { localStorage.setItem('pivot-theme', currentTheme); } catch (e) {}\n}\n\nfunction applyLang() {\n  const t = i18n[currentLang];\n  document.documentElement.lang = t.lang;\n  document.documentElement.dir = t.dir;\n  document.getElementById('langBtn').textContent = t.btn;\n  document.getElementById('t-title').textContent = t.title;\n  document.getElementById('t-subtitle').textContent = t.subtitle;\n  document.getElementById('t-inputs').textContent = t.inputs;\n  document.getElementById('t-brand').textContent = t.brand;\n  document.getElementById('t-area').textContent = t.area;\n  document.getElementById('t-spanwidth').textContent = t.spanwidth;\n  document.getElementById('t-totalspans').textContent = t.totalspans;\n  document.getElementById('t-radius').textContent = t.radius;\n  document.getElementById('t-tower').textContent = t.tower;\n  document.getElementById('t-spansper').textContent = t.spansper;\n  document.getElementById('t-perwheel').textContent = t.perwheel;\n  document.getElementById('t-autofill').textContent = t.autofill;\n  document.getElementById('t-clear').textContent = t.clear;\n  document.getElementById('t-col-wheel').textContent = t.colWheel;\n  document.getElementById('t-col-spans').textContent = t.colSpans;\n  document.getElementById('t-col-area').textContent = t.colArea;\n  document.getElementById('t-total').textContent = t.total;\n  document.getElementById('t-note').innerHTML = t.note;\n  // custom panel\n  document.getElementById('t-custom-title').textContent = t.customTitle;\n  document.getElementById('t-custom-sub').textContent = t.customSub;\n  document.getElementById('t-custom-h2').textContent = t.customH2;\n  document.getElementById('t-custom-save').textContent = t.customSave;\n  document.getElementById('t-custom-cancel').textContent = t.customCancel;\n  document.getElementById('t-custom-autofill').textContent = t.customAutofill;\n  document.getElementById('t-custom-clear').textContent = t.customClear;\n  document.getElementById('t-custom-note').textContent = t.customNote;\n  document.getElementById('t-custom-mode').textContent = t.customMode;\n  document.getElementById('t-custom-name').textContent = t.customName;\n  document.getElementById('deleteBrandBtn').textContent = t.deleteBrand;\n  document.getElementById('t-footer-design').innerHTML = t.footerDesign;\n  document.getElementById('t-footer-eq').textContent = t.footerEq;\n  const modeSel = document.getElementById('customMode');\n  if (modeSel) {\n    for (let i = 0; i < modeSel.options.length; i++) {\n      const opt = modeSel.options[i];\n      const label = opt.getAttribute('data-' + currentLang);\n      if (label) opt.textContent = label;\n    }\n  }\n  // brand options\n  const brandSel = document.getElementById('pivotBrand');\n  for (let i = 0; i < brandSel.options.length; i++) {\n    const opt = brandSel.options[i];\n    const label = opt.getAttribute('data-' + currentLang);\n    if (label) opt.textContent = label;\n  }\n  buildTable();\n  if (!document.getElementById('customPanel').classList.contains('hidden')) {\n    customUserSpans = captureUserAsSpans(customInputMode); // keep unsaved edits when switching language\n  }\n  buildCustomGrid();\n}\n\nconst INFO = {\n  en: { title: '💡 About the App', body: `\n    <p><strong>Pivot Area Calculator<\/strong> is a specialized calculator for distributing tracks (spans) across the wheels of Center Pivot irrigation systems.<\/p>\n    <p>It uses the <strong>Biro equation<\/strong> to compute the area of each wheel based on its distance from the pivot center.<\/p>\n    <ul>\n      <li>Enter the pivot area in feddans<\/li>\n      <li>Choose the brand (Valley / Zimmatic / Western) or customize<\/li>\n      <li>Radius and total tracks are calculated automatically (whole numbers)<\/li>\n      <li>Use Auto-fill, or type the tracks of each wheel — areas update instantly<\/li>\n      <li>The last wheel takes the remaining tracks<\/li>\n    <\/ul>\n    <p>The app can be installed and works offline.<\/p>` },\n  ar: { title: '💡 فكرة البرنامج', body: `\n    <p><strong>حاسبة مساحة البيفوت<\/strong> حاسبة متخصصة لتوزيع الجرر على عجلات أجهزة الري المحوري (Center Pivot).<\/p>\n    <p>تعتمد على <strong>معادلة بيرو<\/strong> لحساب مساحة كل عجلة بناءً على بعدها عن مركز البيفوت.<\/p>\n    <ul>\n      <li>أدخل مساحة البيفوت بالفدان<\/li>\n      <li>اختر الماركة (فالي / زيماتيك / ويستيرن) أو خصص بنفسك<\/li>\n      <li>يُحسب نصف القطر وإجمالي الجرر تلقائياً (أرقام صحيحة)<\/li>\n      <li>استخدم التعبئة التلقائية أو اكتب جرر كل عجلة — تُحسب المساحات فوراً<\/li>\n      <li>العجلة الأخيرة تأخذ المتبقي من الجرر<\/li>\n    <\/ul>\n    <p>يمكن تثبيت التطبيق وهو يعمل دون اتصال بالإنترنت.<\/p>` }\n};\nfunction showInfo() {\n  document.getElementById('infoTitle').textContent = INFO[currentLang].title;\n  document.getElementById('infoBody').innerHTML = INFO[currentLang].body;\n  document.getElementById('infoModal').classList.add('active');\n}\nfunction closeInfo() { document.getElementById('infoModal').classList.remove('active'); }\nfunction showVerse() { document.getElementById('verseModal').classList.add('active'); }\nfunction closeVerse() { document.getElementById('verseModal').classList.remove('active'); }\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') { closeInfo(); closeVerse(); closeWarn(); } });\n\nfunction t(key) { return i18n[currentLang][key] || key; }\n\nfunction isCustomMode() {\n  const v = document.getElementById('pivotBrand').value;\n  return v === 'custom' || v.indexOf('saved:') === 0;\n}\n\nfunction getTowerLength() {\n  if (isCustomMode()) return 0;\n  const sel = document.getElementById('pivotBrand');\n  return num(sel.options[sel.selectedIndex].getAttribute('data-length')) || 54;\n}\n\nfunction getSpanWidth() {\n  return num(document.getElementById('spanWidth').value) || 1.8;\n}\n\n/** Returns array of base spans per wheel (length NUM_WHEELS) */\nfunction getBaseSpansArray(totalSpans) {\n  if (isCustomMode() && customSpansPerWheel) {\n    customSpansPerWheel = computeCustomArray(totalSpans);\n    return customSpansPerWheel.slice();\n  }\n  // Standard: each wheel gets towerLen/spanWidth, last takes remainder\n  const base = Math.max(1, Math.round(getTowerLength() / getSpanWidth()));\n  totalSpans = Math.round(totalSpans);\n  const arr = [];\n  let remaining = totalSpans;\n  for (let i = 0; i < NUM_WHEELS; i++) {\n    if (remaining <= 0) { arr.push(0); continue; }\n    let take = (i === NUM_WHEELS - 1) ? remaining : Math.min(base, remaining);\n    arr.push(take);\n    remaining -= take;\n  }\n  return arr;\n}\n\nfunction getRadius(area) {\n  return Math.sqrt(area * 4200 / PI);\n}\n\nfunction cumulativeArea(area, radius, distance) {\n  if (distance <= 0) return 0;\n  const effectiveDist = Math.min(distance, radius);\n  const ratio = Math.min(1, Math.max(-1, effectiveDist / radius));\n  const angleDeg = Math.asin(ratio) * (180 / PI);\n  const cosVal = Math.cos(angleDeg * PI / 180);\n  const g = (radius - distance >= 0) ? (cosVal * radius) : 0;\n  return (2 * angleDeg * area / 360) + (g * distance / 4200);\n}\n\nfunction getBaseAreas(area, radius, spanWidth, totalSpans, baseSpansArr) {\n  const baseAreas = new Array(NUM_WHEELS).fill(0);\n  const baseCounts = new Array(NUM_WHEELS).fill(0);\n  let cumulSpans = 0, prevCumul = 0;\n  for (let i = 0; i < NUM_WHEELS; i++) {\n    const take = baseSpansArr[i] || 0;\n    if (take <= 0) continue;\n    cumulSpans += take;\n    const dist = cumulSpans * spanWidth;\n    const cumul = cumulativeArea(area, radius, dist);\n    baseAreas[i] = Math.max(0, cumul - prevCumul);\n    baseCounts[i] = take;\n    prevCumul = cumul;\n  }\n  getBaseAreas._counts = baseCounts;\n  return baseAreas;\n}\n\nfunction buildTable() {\n  const tbody = document.getElementById('tableBody');\n  const wheelWord = t('wheel');\n  const saved = {};\n  for (let i = 1; i <= NUM_WHEELS; i++) {\n    const el = document.getElementById('spans' + i);\n    if (el) saved[i] = el.value;\n  }\n  tbody.innerHTML = '';\n  for (let i = 1; i <= NUM_WHEELS; i++) {\n    const tr = document.createElement('tr');\n    if (i === NUM_WHEELS) tr.classList.add('wheel-last');\n    tr.innerHTML = `\n      <td><strong>${wheelWord} ${i}<\/strong><\/td>\n      <td><input type=\"text\" inputmode=\"numeric\" lang=\"en\" dir=\"ltr\" id=\"spans${i}\" value=\"${saved[i] || ''}\" min=\"0\" step=\"0.1\" oninput=\"onSpansInput(${i}, this)\"><\/td>\n      <td id=\"area${i}\">—<\/td>\n    `;\n    tbody.appendChild(tr);\n  }\n}\n\nlet customInputMode = 'spans'; // 'spans' | 'length'\nlet customUserSpans = null;    // tracks typed by the user (numbers), remainder is never stored\nlet customRemIdx = 0;          // row that currently holds the remainder\n\nfunction modeNow() {\n  const m = document.getElementById('customMode');\n  return m ? m.value : 'spans';\n}\n\nfunction getMainTotals() {\n  const area = num(document.getElementById('pivotArea').value) || 0;\n  const spanWidth = getSpanWidth();\n  const radius = getRadius(area);\n  const totalSpans = radius / spanWidth;\n  return { area, spanWidth, radius, totalSpans };\n}\n\nfunction totalInMode() {\n  const { radius, totalSpans } = getMainTotals();\n  return modeNow() === 'length' ? radius : Math.round(totalSpans);\n}\n\nfunction fmtVal(v) {\n  return modeNow() === 'length' ? String(Math.round(v * 100) / 100) : String(Math.round(v));\n}\n\n/** Array of 9: user rows, then the remainder in the first free row after them */\nfunction computeCustomArray(total) {\n  const u = customUserSpans || [];\n  let L = -1;\n  for (let i = 0; i < NUM_WHEELS - 1; i++) if ((u[i] || 0) > 0) L = i;\n  const arr = new Array(NUM_WHEELS).fill(0);\n  let used = 0;\n  for (let i = 0; i <= L; i++) { arr[i] = u[i] || 0; used += arr[i]; }\n  const remIdx = Math.min(L + 1, NUM_WHEELS - 1);\n  arr[remIdx] = Math.max(0, Math.round(total) - used);\n  return arr;\n}\n\n/** Values typed by the user in the panel (null = empty / auto remainder) */\nfunction readUser() {\n  const out = [];\n  for (let i = 0; i < NUM_WHEELS; i++) {\n    const el = document.getElementById('customSpan' + i);\n    if (!el || i === NUM_WHEELS - 1 || el.dataset.auto === '1' || el.disabled) { out.push(null); continue; }\n    const raw = el.value.trim();\n    out.push(raw === '' ? null : (num(raw) || 0));\n  }\n  return out;\n}\n\n/** Re-layout: the remainder always sits in the row right after the last filled row */\nfunction refreshCustom() {\n  const u = readUser();\n  let L = -1;\n  for (let i = 0; i < NUM_WHEELS - 1; i++) if (u[i] !== null) L = i;\n  const remIdx = Math.min(L + 1, NUM_WHEELS - 1);\n  const used = u.reduce((acc, v) => acc + (v || 0), 0);\n  const rem = Math.max(0, totalInMode() - used);\n  const active = document.activeElement;\n  for (let i = 0; i < NUM_WHEELS; i++) {\n    const el = document.getElementById('customSpan' + i);\n    const item = el.closest('.custom-item');\n    item.classList.toggle('wheel-last', i === remIdx);\n    el.style.background = (i === remIdx) ? 'var(--last-bg)' : '';\n    if (i < remIdx) {\n      el.disabled = false; el.readOnly = false; el.dataset.auto = '';\n      item.style.opacity = '';\n    } else if (i === remIdx) {\n      el.disabled = false; el.readOnly = (i === NUM_WHEELS - 1);\n      item.style.opacity = '';\n      if (el !== active || el.dataset.auto === '1') {\n        el.value = fmtVal(rem); el.dataset.auto = '1';\n      }\n    } else {\n      el.disabled = true; el.value = ''; el.dataset.auto = '';\n      item.style.opacity = '0.45';\n    }\n  }\n  customRemIdx = remIdx;\n}\n\nfunction onCustomInputChange(idx) {\n  const el = document.getElementById('customSpan' + idx);\n  if (el.dataset.auto === '1') el.dataset.auto = ''; // user is overriding the remainder row\n  refreshCustom();\n}\n\nfunction onCustomBlur(idx) {\n  const el = document.getElementById('customSpan' + idx);\n  if (idx < customRemIdx) {\n    // don't allow more than what is left\n    const u = readUser();\n    const others = u.reduce((acc, v, i) => acc + (i === idx ? 0 : (v || 0)), 0);\n    const maxV = Math.max(0, totalInMode() - others);\n    const v = num(el.value);\n    if (!isNaN(v) && v > maxV + 0.05) {\n      alert(t('alertMax').replace('{n}', idx + 1).replace('{m}', fmtVal(maxV)));\n      el.value = fmtVal(maxV);\n    }\n  }\n  refreshCustom();\n}\n\nfunction captureUserAsSpans(mode) {\n  const u = readUser();\n  const w = getSpanWidth();\n  return u.map(v => v === null ? 0 : (mode === 'length' ? Math.round(v / w) : Math.round(v)));\n}\n\nfunction onCustomModeChange() {\n  customUserSpans = captureUserAsSpans(customInputMode); // customInputMode = previous mode\n  buildCustomGrid();\n}\n\nfunction buildCustomGrid() {\n  const grid = document.getElementById('customGrid');\n  const wheelWord = t('wheel');\n  const mode = modeNow();\n  customInputMode = mode;\n  const w = getSpanWidth();\n  const unit = mode === 'length' ? 'm' : '';\n  grid.innerHTML = '';\n  for (let i = 0; i < NUM_WHEELS; i++) {\n    let val = '';\n    const sp = customUserSpans && customUserSpans[i];\n    if (sp > 0 && i < NUM_WHEELS - 1) val = mode === 'length' ? String(Math.round(sp * w * 100) / 100) : String(sp);\n    const div = document.createElement('div');\n    div.className = 'custom-item';\n    div.innerHTML = `\n      <label>${wheelWord} ${i + 1}<\/label>\n      <input type=\"text\" inputmode=\"decimal\" lang=\"en\" dir=\"ltr\" id=\"customSpan${i}\" value=\"${val}\" placeholder=\"0\"\n        oninput=\"fixDigits(this);onCustomInputChange(${i})\" onblur=\"onCustomBlur(${i})\">\n      <span class=\"unit\">${unit}<\/span>\n    `;\n    grid.appendChild(div);\n  }\n  refreshCustom();\n}\n\nfunction autoFillCustom() {\n  // Full 54 m towers first; the remainder lands in the very next row\n  const { spanWidth, radius, totalSpans } = getMainTotals();\n  const mode = modeNow();\n  const std = mode === 'length' ? 54 : Math.round(spanWidth > 0 ? 54 / spanWidth : 30);\n  let remaining = mode === 'length' ? radius : Math.round(totalSpans);\n  let i = 0;\n  for (; i < NUM_WHEELS - 1; i++) {\n    const el = document.getElementById('customSpan' + i);\n    el.dataset.auto = '';\n    if (remaining > std + 0.001) { el.value = fmtVal(std); remaining -= std; }\n    else { el.value = ''; }\n  }\n  document.getElementById('customSpan' + (NUM_WHEELS - 1)).value = '';\n  refreshCustom();\n}\n\nfunction clearCustom() {\n  for (let i = 0; i < NUM_WHEELS; i++) {\n    const el = document.getElementById('customSpan' + i);\n    el.value = ''; el.dataset.auto = '';\n  }\n  refreshCustom();\n}\n\nlet editingBrandId = null;\nlet prevBrandValue = 'zimmatic';\nlet savedBrands = [];\n\nfunction loadBrands() {\n  try { savedBrands = JSON.parse(localStorage.g ckground:var(--ts-track)!important;color:var(--ts-ink)!important}td input{background:var(--ts-input)!important}svg{background:#ffffff;border-radius:8px}details summary{color:var(--ts-pri)!important}th{background:var(--ts-pri)!important;color:#fff!important}.scroll{border-color:var(--ts-line)!important}<\/style>\n<\/head>\n<body>\n<header><h1>💧 حساب كفاءة الري بالرش المحوري (بيفوت)<\/h1><p>أدخل قراءات أوعية التجميع وستظهر النتائج والمنحنى فورًا، ثم صدّرها إلى Excel<\/p>\n<\/header>\n<main>\n\n<div class=\"card\">\n<h2>المدخلات<\/h2>\n<div class=\"grid\">\n<div><label>اسم البيفوت<\/label><input id=\"pname\" type=\"text\" autocomplete=\"off\"><\/div>\n<div><label>ضغط التشغيل (بار)<\/label><input id=\"pres\" inputmode=\"decimal\"><\/div>\n<div><label>مساحة البيفوت (فدان)<\/label><input id=\"feddan\" inputmode=\"decimal\"><\/div>\n<div><label>عدد م² في الفدان<\/label><input id=\"m2\" inputmode=\"decimal\"><\/div>\n<div><label>زمن الدورة (ساعة)<\/label><input id=\"cycle\" inputmode=\"decimal\"><\/div>\n<div><label>قطر وعاء التجميع (سم)<\/label><input id=\"diam\" inputmode=\"decimal\"><\/div>\n<div><label>معيار القيمة غير الطبيعية (k × الانحراف المعياري)<\/label><input id=\"k\" inputmode=\"decimal\"><\/div>\n<div><label>مساحة البيفوت (م²)<\/label><input id=\"areaM2\" class=\"ro\" readonly><\/div>\n<div><label>مساحة فوهة الوعاء (سم²)<\/label><input id=\"canA\" class=\"ro\" readonly><\/div>\n<\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>استيراد ذكي للقراءات<\/h2>\n<textarea id=\"paste\" style=\"min-height:150px\" placeholder=\"الصق القراءات هنا كما هي، مثال:&#10;البرج السابع&#10;٥٥٠&#10;٥٠٠&#10;البرج السادس&#10;٤٠٠&#10;٥٠٠&#10;&#10;أو: سطر لكل قراءة (البرج ثم الحجم)&#10;1  450\"><\/textarea>\n<div class=\"bar\">\n<button id=\"pasteBtn\">تحليل وإضافة المنسوخ<\/button>\n<button class=\"sec\" id=\"fileBtn\">استيراد من ملف (Excel / CSV / نص / SVG)<\/button>\n<input type=\"file\" id=\"file\" accept=\".xlsx,.xls,.xlsm,.ods,.csv,.txt,.tsv,.svg\" style=\"display:none\">\n<\/div>\n<div class=\"row\" style=\"margin-top:8px;gap:16px\">\n<label style=\"display:flex;gap:6px;align-items:center;margin:0;width:auto\"><input type=\"checkbox\" id=\"optReplace\" checked style=\"width:auto\"> استبدال القراءات الحالية<\/label>\n<label style=\"display:flex;gap:6px;align-items:center;margin:0;width:auto\"><input type=\"checkbox\" id=\"optSort\" checked style=\"width:auto\"> ترتيب الأبراج من الأول إلى الأخير<\/label>\n<\/div>\n<div id=\"impMsg\" class=\"note\" style=\"font-size:13px\"><\/div>\n<p class=\"note\">يتعرف على: عنوان البرج (البرج السابع / برج 3 / Tower 2 / End) متبوعًا بقراءاته، أو سطر \"برج ثم حجم\"، أو جدول Excel بعمودين (برج، حجم). الأرقام العربية والإنجليزية مقبولة.<\/p>\n<\/div>\n\n<div class=\"card\">\n<h2>إدخال القراءات (الحجم المجمّع بالملليلتر)<\/h2>\n<div class=\"row\">\n<div><label>البرج<\/label><input id=\"qt\" placeholder=\"مثال: 1\"><\/div>\n<div><label>الحجم (مل)<\/label><input id=\"qv\" inputmode=\"decimal\" placeholder=\"مثال: 450\"><\/div>\n<div style=\"flex:0 0 auto\"><button id=\"addBtn\">+ إضافة قراءة<\/button><\/div>\n<\/div>\n<p class=\"note\">أو اكتب الحجم واضغط Enter لإضافة قراءة جديدة بسرعة بنفس البرج. الأرقام العربية (٤٥٠) مقبولة. السعة القصوى 300 قراءة.<\/p>\n\n<div class=\"scroll\" style=\"margin-top:10px\"><table>\n<thead><tr><th>#<\/th><th>البرج<\/th><th>الحجم (مل)<\/th><th>العمق (مم)<\/th><th>الحالة<\/th><th><\/th><\/tr><\/thead>\n<tbody id=\"tb\"><\/tbody><\/table><\/div>\n<div class=\"bar\">\n<button class=\"grn\" id=\"xlsBtn\">تصدير إلى Excel<\/button>\n<button class=\"sec\" id=\"svgBtn\">تصدير SVG (بيانات + رسم)<\/button>\n<button class=\"sec\" id=\"pngBtn\">تنزيل الرسم PNG<\/button>\n<button class=\"sec\" id=\"sampleBtn\">بيانات المثال<\/button>\n<button class=\"dng\" id=\"clearBtn\">مسح القراءات<\/button>\n<\/div>\n<p class=\"note\">ملف Excel المُصدَّر يحتوي المدخلات والنتائج والجدول بمعادلات حيّة (تتحدث لو عدّلت القراءات في Excel). الرسم يُنزَّل منفصلًا بصيغة PNG.<\/p>\n<\/div>\n\n<div class=\"card\">\n<h2>النتائج<\/h2>\n<div style=\"overflow:auto\"><table>\n<thead><tr><th>البند<\/th><th>كل القراءات<\/th><th>بعد استبعاد القيم غير الطبيعية<\/th><th>التقييم (كل)<\/th><th>التقييم (بعد)<\/th><th class=\"eqc\">المعادلة<\/th><\/tr><\/thead>\n<tbody id=\"res\"><\/tbody><\/table><\/div>\n<details style=\"margin-top:12px\"><summary>جدول حدود التقييم (قابل للتعديل)<\/summary>\n<table><thead><tr><th>المستوى<\/th><th>CU % ≥<\/th><th>DU % ≥<\/th><th>CV % &lt;<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>ممتاز<\/td><td><input data-th=\"CU0\"><\/td><td><input data-th=\"DU0\"><\/td><td><input data-th=\"CV0\"><\/td><\/tr>\n<tr><td>جيد<\/td><td><input data-th=\"CU1\"><\/td><td><input data-th=\"DU1\"><\/td><td><input data-th=\"CV1\"><\/td><\/tr>\n<tr><td>مقبول<\/td><td><input data-th=\"CU2\"><\/td><td><input data-th=\"DU2\"><\/td><td><input data-th=\"CV2\"><\/td><\/tr>\n<tr><td>ضعيف<\/td><td colspan=\"3\">أقل من ذلك<\/td><\/tr><\/tbody><\/table>\n<p class=\"note\">حدود شائعة في الأدبيات، عدّلها حسب المرجع الذي تعتمده.<\/p><\/details>\n<\/div>\n\n<div class=\"card\">\n<h2>المنحنى والقيم غير الطبيعية<\/h2>\n<div class=\"bar\" style=\"margin:0 0 8px;align-items:center\">\n<button class=\"sec\" id=\"zin\">+ تكبير<\/button><button class=\"sec\" id=\"zout\">− تصغير<\/button>\n<span class=\"note\" style=\"margin:0\">اسحب المنحنى يمينًا ويسارًا للتنقل بين الأبراج<\/span><\/div>\n<div id=\"chartWrap\" style=\"display:flex;direction:ltr;border:1px solid var(--line);border-radius:6px;background:#fff\">\n<svg id=\"chartY\" xmlns=\"http://www.w3.org/2000/svg\" style=\"flex:0 0 auto;max-width:none;width:52px;height:360px\"><\/svg>\n<div id=\"chartScroll\" style=\"overflow-x:auto;flex:1;min-width:0;cursor:grab\"><svg id=\"chart\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:none;height:360px\"><\/svg><\/div>\n<\/div>\n<div id=\"legend\" style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px\"><\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>تحليل حسب العجلة (البرج)<\/h2>\n<p class=\"note\" style=\"margin-top:0\">نسبة الانحراف = (متوسط عمق العجلة ÷ متوسط كل الأعماق) × 100 — القيم القريبة من 100% تعني أن العجلة قريبة من المتوسط العام. مؤشر التقارب يعتمد على معامل الاختلاف (CV) داخل قراءات العجلة نفسها.<\/p>\n<div style=\"overflow:auto;margin-bottom:12px\"><table>\n<thead><tr><th>العجلة / البرج<\/th><th>عدد القراءات<\/th><th>متوسط العمق (مم)<\/th><th>نسبة الانحراف %<\/th><th>الانحراف المعياري<\/th><th>CV %<\/th><th>مؤشر التقارب<\/th><\/tr><\/thead>\n<tbody id=\"towTb\"><\/tbody>\n<\/table><\/div>\n<div id=\"towChartWrap\" style=\"direction:ltr;border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 4px 4px\">\n<svg id=\"towChart\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:220px;display:block\"><\/svg>\n<\/div>\n<div id=\"towLegend\" style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px\"><\/div>\n<\/div>\n\n\n<\/main>\n<script>\nconst $=id=>document.getElementById(id);\nconst SAMPLE=[[1,450],[1,450],[1,380],[1,380],[1,380],[2,350],[2,400],[2,380],[2,450],[2,500],[2,500],[2,450],[2,450],[2,450],[3,350],[3,400],[3,450],[3,400],[3,450],[3,400],[3,450],[3,480],[3,350],[4,400],[4,500],[4,400],[4,400],[4,400],[4,400],[4,400],[4,400],[5,400],[5,400],[5,430],[5,400],[5,400],[5,450],[5,400],[5,400],[5,400],[5,400],[5,430],[6,450],[6,400],[6,400],[6,400],[6,400],[6,400],[6,400],[6,400],[6,400],[7,400],[7,400],[7,400],[7,400],[7,400],[7,400],[7,400],[7,400],[7,400],[\"End\",450],[\"End\",400],[\"End\",400],[\"End\",500]];\nconst CAP=300, KEY='pivotEntryV1';\nfunction defState(){return{pname:'',pres:null,feddan:125,m2:4200,cycle:10,diam:35,k:2,th:{CU:[90,80,70],DU:[90,80,70],CV:[10,20,30]},rows:SAMPLE.map(r=>({t:String(r[0]),v:String(r[1])})),lastT:'1'}}\nlet S=defState();\ntry{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.rows)S=s}catch(e){}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\nfunction toNum(s){if(typeof s==='number')return s;if(s==null)return null;\n s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g,'.').trim();\n if(s==='')return null;const n=Number(s);return isNaN(n)?null:n}\nconst fmt=(v,d=2)=>(v==null||v==='')?'':Number(v).toFixed(d);\nconst level=(v,th,hi)=>v==null?'':hi?(v>=th[0]?'ممتاز':v>=th[1]?'جيد':v>=th[2]?'مقبول':'ضعيف'):(v<th[0]?'ممتاز':v<th[1]?'جيد':v<th[2]?'مقبول':'ضعيف');\n\nfunction stats(d){const n=d.length;if(!n)return{n:0};\n const mean=d.reduce((a,b)=>a+b,0)/n;\n const sd=n>1?Math.sqrt(d.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(n-1)):null;\n const ad=d.map(x=>Math.abs(x-mean));\n const cu=100*(1-ad.reduce((a,b)=>a+b,0)/(n*mean));\n const cv=sd==null?null:sd/mean*100;\n const k=Math.round(n/4);const sorted=[...d].sort((a,b)=>a-b);\n const du=k>0?sorted.slice(0,k).reduce((a,b)=>a+b,0)/k/mean*100:null;\n return{n,mean,sd,min:sorted[0],max:sorted[n-1],ad,cu,cv,du}}\nfunction ranks(d){const idx=d.map((v,i)=>i).sort((a,b)=>d[a]-d[b]||a-b);const r=[];idx.forEach((i,p)=>r[i]=p+1);return r}\n\nfunction calc(){\n const area=S.feddan*S.m2, can=Math.PI*Math.pow(S.diam/2,2);\n const items=[];S.rows.forEach((r,i)=>{const v=toNum(r.v);if(v!=null)items.push({i,t:r.t,v,D:v/can*10})});\n const d=items.map(x=>x.D);const A=stats(d);\n let ucl=null,lcl=null;\n if(A.n>1&&A.sd!=null){ucl=A.mean+S.k*A.sd;lcl=A.mean-S.k*A.sd}\n items.forEach(x=>x.st=(ucl!=null&&(x.D>ucl||x.D<lcl))?'غير طبيعي':'طبيعي');\n const clean=items.filter(x=>x.st==='طبيعي');const C=stats(clean.map(x=>x.D));\n const rk=ranks(d);items.forEach((x,j)=>{x.rank=rk[j];x.E=A.ad?A.ad[j]:null});\n const rc=ranks(clean.map(x=>x.D));clean.forEach((x,j)=>{x.rankC=rc[j];x.I=C.ad[j]});\n const q=s=>s.n?s.mean/1000*area/S.cycle:null;\n // per tower (عجلة)\n const byT={};items.forEach(x=>{if(!byT[x.t])byT[x.t]=[];byT[x.t].push(x)});\n const keyOrder=t=>{const n=Number(t);return String(t).trim()!==''&&!isNaN(n)?n:Infinity};\n const towers=Object.keys(byT).map(t=>{\n  const arr=byT[t], ds=arr.map(x=>x.D), st=stats(ds);\n  const rel=A.mean?st.mean/A.mean*100:null;\n  return{t,n:st.n,mean:st.mean,sd:st.sd,cv:st.cv,min:st.min,max:st.max,rel,items:arr,close:level(st.cv,S.th.CV,0)};\n }).sort((a,b)=>{const x=keyOrder(a.t),y=keyOrder(b.t);return x===y?String(a.t).localeCompare(String(b.t)):(x<y?-1:1)});\n return{area,can,items,clean,A,C,ucl,lcl,QA:q(A),QC:q(C),outN:items.filter(x=>x.st==='غير طبيعي').length,towers}}\n\nlet R=null;\nfunction render(){\n R=calc();\n $('areaM2').value=R.area.toLocaleString('en');$('canA').value=R.can.toFixed(2);\n // table computed cells\n const map={};R.items.forEach((x,j)=>map[x.i]=Object.assign(x,{no:j+1}));\n [...$('tb').rows].forEach((tr,i)=>{const x=map[i];\n  tr.cells[0].textContent=x?x.no:'';tr.cells[3].textContent=x?fmt(x.D):'';\n  const stc=tr.cells[4];stc.textContent=x?x.st:'';tr.classList.toggle('out',!!x&&x.st==='غير طبيعي')});\n // results\n const A=R.A,C=R.C,th=S.th;\n const rows=[\n ['عدد القراءات n',A.n,C.n,0,'','','n = عدد القراءات'],\n ['متوسط العمق D̄ (مم)',A.mean,C.mean,2,'','','D̄ = ΣDi ÷ n'],\n ['الانحراف المعياري SD (مم)',A.sd,C.sd,2,'','','SD = √[Σ(Di − D̄)² ÷ (n−1)]'],\n ['أقل عمق (مم)',A.min,C.min,2,'','',''],\n ['أكبر عمق (مم)',A.max,C.max,2,'','',''],\n ['معامل الانتظام CU %',A.cu,C.cu,2,level(A.cu,th.CU,1),level(C.cu,th.CU,1),'CU = 100 × [1 − Σ|Di − D̄| ÷ (n × D̄)]'],\n ['معامل الاختلاف CV %',A.cv,C.cv,2,level(A.cv,th.CV,0),level(C.cv,th.CV,0),'CV = (SD ÷ D̄) × 100'],\n ['كفاءة التوزيع DU %',A.du,C.du,2,level(A.du,th.DU,1),level(C.du,th.DU,1),'DU = (متوسط أقل ربع ÷ D̄) × 100'],\n ['تصرف البيفوت Q (م³/ساعة)',R.QA,R.QC,1,'','','Q = (D̄ ÷ 1000) × مساحة البيفوت ÷ زمن الدورة'],\n ['تصرف البيفوت Q (لتر/ثانية)',R.QA==null?null:R.QA*1000/3600,R.QC==null?null:R.QC*1000/3600,1,'','','Q(ل/ث) = Q(م³/س) × 1000 ÷ 3600'],\n ['الحد الأعلى للقراءة العادية (مم)',R.ucl,null,2,'','','D̄ + k × SD'],\n ['الحد الأدنى للقراءة العادية (مم)',R.lcl,null,2,'','','D̄ − k × SD'],\n ['عدد القيم غير الطبيعية',R.outN,null,0,'','','']];\n const bd=l=>l?`<span class=\"badge b-${l}\">${l}<\/span>`:'';\n $('res').innerHTML=rows.map((r,i)=>`<tr><td class=\"l ${i>=5&&i<=7?'k':''}\">${r[0]}<\/td><td>${fmt(r[1],r[3])}<\/td><td>${fmt(r[2],r[3])}<\/td><td>${bd(r[4])}<\/td><td>${bd(r[5])}<\/td><td class=\"eq eqc\">${r[6]}<\/td><\/tr>`).join('');\n // tower table\n const tw=R.towers||[];\n $('towTb').innerHTML=tw.map(t=>{\n  const relCls=t.rel==null?'':(Math.abs(t.rel-100)<=5?'b-ممتاز':Math.abs(t.rel-100)<=10?'b-جيد':Math.abs(t.rel-100)<=15?'b-مقبول':'b-ضعيف');\n  return `<tr><td class=\"l k\">${String(t.t)}<\/td><td>${t.n}<\/td><td>${fmt(t.mean)}<\/td><td><span class=\"badge ${relCls}\">${fmt(t.rel,1)}%<\/span><\/td><td>${fmt(t.sd)}<\/td><td>${fmt(t.cv)}<\/td><td>${bd(t.close)}<\/td><\/tr>`;\n }).join('')||'<tr><td colspan=\"7\">لا توجد قراءات<\/td><\/tr>';\n chart();towChart();save()}\n\nfunction mkRow(i){const r=S.rows[i];const tr=document.createElement('tr');\n tr.innerHTML=`<td><\/td><td><input value=\"\"><\/td><td><input inputmode=\"decimal\"><\/td><td><\/td><td><\/td><td><button class=\"dng\" style=\"padding:3px 9px\">✕<\/button><\/td>`;\n const [it,iv]=tr.querySelectorAll('input');it.value=r.t;iv.value=r.v;\n const idx=()=>[...$('tb').rows].indexOf(tr);\n it.oninput=()=>{S.rows[idx()].t=it.value;S.lastT=it.value;render()};\n iv.oninput=()=>{S.rows[idx()].v=iv.value;render()};\n tr.querySelector('button').onclick=()=>{S.rows.splice(idx(),1);tr.remove();render()};\n return tr}\nfunction rebuild(){const tb=$('tb');tb.innerHTML='';S.rows.forEach((r,i)=>tb.appendChild(mkRow(i)));render()}\nfunction addRow(t,v){if(S.rows.length>=CAP){alert('وصلت للحد الأقصى (300 قراءة)');return false}\n S.rows.push({t:String(t),v:String(v)});$('tb').appendChild(mkRow(S.rows.length-1));return true}\n\nconst CH=360,CL=52,CT=24,CB=64,PAD=26;let PX=34;\nconst FF='font-family=\"Tahoma,Arial\"';\nconst LEG=[['#1F4E78','العمق D (نقطة صغيرة)','lc'],['#ff0000','قيمة غير طبيعية','c'],['#c00000','الحد الأعلى/الأدنى','ln'],['#548235','المتوسط','dot']];\nfunction monoPath(pts){const n=pts.length;if(n<2)return'';\n const dx=[],m=[],t=[];\n for(let i=0;i<n-1;i++){dx[i]=pts[i+1][0]-pts[i][0];m[i]=(pts[i+1][1]-pts[i][1])/dx[i]}\n t[0]=m[0];t[n-1]=m[n-2];\n for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;\n for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=0;t[i+1]=0}else{const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}}\n let d=`M${pts[0][0]},${pts[0][1]}`;\n for(let i=0;i<n-1;i++){const[x0,y0]=pts[i],[x1,y1]=pts[i+1],w=dx[i]/3;d+=` C${x0+w},${y0+t[i]*w} ${x1-w},${y1-t[i+1]*w} ${x1},${y1}`}\n return d}\nfunction chartBuild(){\n const items=R.items,n=items.length,H=CH;if(!n)return null;\n const avail=Math.max(280,($('chartWrap').clientWidth||800)-CL-2);\n const Wp=Math.max(avail,PAD*2+(n-1)*PX);\n const mx=Math.max(...items.map(x=>x.D),R.ucl==null?0:R.ucl)*1.08;const step=mx<=4?0.5:mx<=8?1:mx<=20?2:5;\n const ymax=Math.ceil(mx/step)*step;\n const X=i=>n===1?Wp/2:PAD+(Wp-2*PAD)*(i/(n-1)),Y=v=>H-CB-(H-CT-CB)*(v/ymax);\n let ys='',p='';\n for(let v=0;v<=ymax+1e-9;v+=step){p+=`<line x1=\"0\" x2=\"${Wp}\" y1=\"${Y(v)}\" y2=\"${Y(v)}\" stroke=\"#d9d9d9\"/>`;ys+=`<text x=\"${CL-6}\" y=\"${Y(v)+4}\" text-anchor=\"end\" font-size=\"12\" fill=\"#555\" ${FF}>${v.toFixed(step<1?1:0)}<\/text>`}\n ys+=`<text transform=\"translate(12 ${(CT+H-CB)/2}) rotate(-90)\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\" ${FF}>العمق (مم)<\/text><line x1=\"${CL-0.5}\" x2=\"${CL-0.5}\" y1=\"${CT}\" y2=\"${H-CB}\" stroke=\"#555\"/>`;\n let g0=0;for(let i=1;i<=n;i++){if(i===n||items[i].t!==items[g0].t){\n   const mid=(X(g0)+X(i-1))/2;\n   if(g0>0){const sx=(X(g0-1)+X(g0))/2;p+=`<line x1=\"${sx}\" x2=\"${sx}\" y1=\"${CT}\" y2=\"${H-CB}\" stroke=\"#bbb\" stroke-dasharray=\"2 4\"/>`}\n   p+=`<text x=\"${mid}\" y=\"${H-CB+32}\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#1F4E78\" ${FF}>${String(items[g0].t).replace(/&/g,'&amp;').replace(/<\/g,'&lt;')}<\/text>`;g0=i}}\n const tk=Math.max(1,Math.ceil(26/Math.max(1,(Wp-2*PAD)/Math.max(1,n-1))));\n for(let i=0;i<n;i+=tk)p+=`<text x=\"${X(i)}\" y=\"${H-CB+15}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#777\" ${FF}>${i+1}<\/text>`;\n p+=`<text x=\"${Wp/2}\" y=\"${H-CB+52}\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\" ${FF}>رقم القراءة (واسم البرج بالأزرق)<\/text>`;\n p+=`<line x1=\"0\" x2=\"${Wp}\" y1=\"${H-CB}\" y2=\"${H-CB}\" stroke=\"#555\"/>`;\n if(R.ucl!=null){[R.ucl,R.lcl].forEach(v=>{if(v>=0&&v<=ymax)p+=`<line x1=\"0\" x2=\"${Wp}\" y1=\"${Y(v)}\" y2=\"${Y(v)}\" stroke=\"#c00000\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/>`})}\n p+=`<line x1=\"0\" x2=\"${Wp}\" y1=\"${Y(R.A.mean)}\" y2=\"${Y(R.A.mean)}\" stroke=\"#548235\" stroke-width=\"2\" stroke-dasharray=\"2 4\"/>`;\n const pts=items.map((x,i)=>[X(i),Y(x.D)]);\n p+=n>1?`<path d=\"${monoPath(pts)}\" fill=\"none\" stroke=\"#1F4E78\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>`:'';\n pts.forEach(([x,y],i)=>{if(items[i].st!=='غير طبيعي')p+=`<circle cx=\"${x}\" cy=\"${y}\" r=\"4.5\" fill=\"#1F4E78\" stroke=\"#fff\" stroke-width=\"1\"/>`});\n items.forEach((x,i)=>{if(x.st==='غير طبيعي'){const[cx,cy]=pts[i];p+=`<circle cx=\"${cx}\" cy=\"${cy}\" r=\"6\" fill=\"#ff0000\" stroke=\"#990000\" stroke-width=\"1.5\"/><text x=\"${cx}\" y=\"${cy-11}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#990000\" font-weight=\"bold\" ${FF}>${x.D.toFixed(2)}<\/text>`}});\n return{n,H,Wp,ys,p}}\nfunction legSym(c,k,x,y){return k==='c'?`<circle cx=\"${x+9}\" cy=\"${y}\" r=\"5\" fill=\"${c}\" stroke=\"#990000\"/>`:k==='lc'?`<line x1=\"${x}\" x2=\"${x+18}\" y1=\"${y}\" y2=\"${y}\" stroke=\"${c}\" stroke-width=\"2.5\"/><circle cx=\"${x+9}\" cy=\"${y}\" r=\"4\" fill=\"${c}\"/>`:`<line x1=\"${x}\" x2=\"${x+18}\" y1=\"${y}\" y2=\"${y}\" stroke=\"${c}\" stroke-width=\"3\" ${k==='ln'?'stroke-dasharray=\"6 3\"':k==='dot'?'stroke-dasharray=\"2 3\"':''}/>`}\nfunction chart(){const b=chartBuild(),Y=$('chartY'),P=$('chart');\n $('legend').innerHTML=LEG.map(([c,t,k])=>`<span style=\"display:inline-flex;align-items:center;gap:5px\"><svg width=\"20\" height=\"12\" viewBox=\"0 0 20 12\" style=\"width:20px;height:12px\">${legSym(c,k,1,6)}<\/svg>${t}<\/span>`).join('');\n if(!b){Y.innerHTML='';Y.style.width='0';P.setAttribute('viewBox','0 0 600 120');P.style.width='100%';P.style.height='120px';P.innerHTML=`<text x=\"300\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" fill=\"#888\" ${FF}>أدخل قراءات ليظهر المنحنى<\/text>`;return}\n Y.style.width=CL+'px';Y.style.height=b.H+'px';Y.setAttribute('viewBox',`0 0 ${CL} ${b.H}`);Y.innerHTML=b.ys;\n P.style.width=b.Wp+'px';P.style.height=b.H+'px';P.setAttribute('viewBox',`0 0 ${b.Wp} ${b.H}`);P.innerHTML=b.p}\n\n// ---------- tower chart (متوسط الأعماق لكل عجلة + نسبة الانحراف) ----------\nconst TOW_LEG=[['#1F4E78','متوسط العمق (مم)','lc'],['#548235','الخط 100% (المتوسط العام)','dot'],['#c00000','نسبة الانحراف %','ln']];\nfunction towChartBuild(){\n const tw=R&&R.towers?R.towers:[];if(!tw.length)return null;\n const n=tw.length,H=200,L=48,Rgt=48,T=28,B=48,W=Math.max(360,n*70+L+Rgt);\n const means=tw.map(t=>t.mean),rels=tw.map(t=>t.rel);\n const mxM=Math.max(...means,R.A.mean||0)*1.15||1;\n const maxDev=Math.max(15,...rels.map(x=>Math.abs((x||100)-100)));\n const rMin=100-maxDev*1.2, rMax=100+maxDev*1.2;\n const X=i=>n===1?(L+W-Rgt)/2:L+(W-L-Rgt)*(i/(n-1));\n const Ym=v=>H-B-(H-T-B)*(v/mxM);\n const Yr=v=>H-B-(H-T-B)*((v-rMin)/(rMax-rMin||1));\n let p='',ys='';\n // grid & y for mean (left)\n const stepM=mxM<=4?0.5:mxM<=10?1:mxM<=25?2:5;\n for(let v=0;v<=mxM+1e-9;v+=stepM){\n  p+=`<line x1=\"${L}\" x2=\"${W-Rgt}\" y1=\"${Ym(v)}\" y2=\"${Ym(v)}\" stroke=\"#eee\"/>`;\n  ys+=`<text x=\"${L-6}\" y=\"${Ym(v)+4}\" text-anchor=\"end\" font-size=\"11\" fill=\"#555\" ${FF}>${v.toFixed(stepM<1?1:0)}<\/text>`;\n }\n ys+=`<text transform=\"translate(14 ${(T+H-B)/2}) rotate(-90)\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1F4E78\" ${FF}>متوسط العمق s].rows[r][k]=t.value;\nif(k=='dist'){const el=$('t'+s+r);if(el)el.placeholder=t.value!==''?Math.round(tot(s,S[s].rows[r])):''}}save()});\n\nfunction addS(s){S[s].rows.push(blank());save();renderData()}\nfunction delS(s,i){S[s].rows.splice(i,1);if(!S[s].rows.length)S[s].rows.push(blank());save();renderData()}\nfunction addC(s){const n=prompt('اسم المرض/الآفة:');if(n){S[s].cols.push(n);save();renderData()}}\nfunction delC(s,j){if(confirm('حذف العمود؟')){S[s].cols.splice(j,1);S[s].rows.forEach(r=>r.vals.splice(j,1));save();renderData()}}\n\nfunction tot(sec,r){if(r.total!==''&&r.total!=null&&!isNaN(r.total))return+r.total;\nif(sec=='veg'&&r.dist!==''&&!isNaN(r.dist))return r.dist/(+S.info.rowW||1.1)*(+S.info.ppm||1);return 0}\nfunction calc(sec){const d=S[sec];let n=0,T=0;\nconst valid=d.rows.filter(r=>tot(sec,r)>0&&r.vals.some(x=>x!==''&&x!=null&&!isNaN(x)));\nvalid.forEach(r=>T+=tot(sec,r));\nconst res=d.cols.map((name,j)=>{let ps=[],si=0,st=0,ent=false;\nvalid.forEach(r=>{const t=tot(sec,r),raw=r.vals[j],x=+(raw||0);if(raw!==''&&raw!=null&&!isNaN(raw))ent=true;ps.push(x/t*100);si+=x;st+=t});\nreturn{name,v:ps.length&&ent?(S.mode=='mean'?ps.reduce((a,b)=>a+b)/ps.length:si/st*100):null}});\nreturn{n:valid.length,T:Math.round(T),res}}\nconst fmt=v=>v==null?'—':(+v.toFixed(1))+'%';\nconst col=v=>v>=10?'var(--high)':v>=4?'var(--mid)':'var(--low)';\nfunction bars(c){return c.res.map(o=>`<div class=\"row\"><div class=\"t\"><span>${esc(o.name)}<\/span><b>${fmt(o.v)}<\/b><\/div><div class=\"bar\"><i style=\"width:${Math.min((o.v||0)*4,100)}%;background:${col(o.v||0)}\"><\/i><\/div><\/div>`).join('')}\nfunction infoLines(){const i=S.info,L=[];\nif(i.pivot)L.push('بيفوت '+i.pivot);if(i.farm)L.push('مزرعة '+i.farm);if(i.area)L.push('المساحة '+i.area+' فدان');\nif(i.variety)L.push('الصنف '+i.variety);if(i.age)L.push('العمر '+i.age+' يوم');if(i.canopy)L.push('كفاءة العرش '+i.canopy+'%');if(i.firm!==undefined&&String(i.firm).trim()!=='')L.push('الصلابة '+i.firm+'%');\nif(i.diam)L.push('قطر أكبر درنة '+i.diam+' سم');return L}\n\nfunction renderRep(){document.querySelector(`input[name=m][value=${S.mode}]`).checked=true;\nconst v=calc('veg'),t=calc('tub'),I=S.info;\n$('repBody').innerHTML=`<div class=\"card\"><h2>تقرير فحص ${I.pivot?'بيفوت '+esc(I.pivot):'البيفوت'} ${I.farm?'- مزرعة '+esc(I.farm):''}<\/h2>\n${I.date?`<div class=\"note\">${esc(I.date)}<\/div>`:''}\n<div>${infoLines().filter(x=>!/^(بيفوت|مزرعة) /.test(x)).map(x=>`<span class=\"kv\">${esc(x)}<\/span>`).join('')}<\/div><\/div>\n<div class=\"card\"><h2>الفحص الخضري<\/h2>${bars(v)}<div class=\"note\">عدد العينات: ${v.n} | إجمالي النباتات المفحوصة: ${v.T}<\/div><\/div>\n<div class=\"card\"><h2>فحص الدرنات<\/h2>${bars(t)}<div class=\"note\">عدد العينات: ${t.n} | إجمالي الدرنات المفحوصة: ${t.T}<\/div><\/div>\n${S.notes?`<div class=\"card\"><h2>ملاحظات<\/h2>${esc(S.notes).replace(/\\n/g,'<br>')}<\/div>`:''}`;\n$('wa').value=mkText()}\n\nfunction mkText(){const v=calc('veg'),t=calc('tub'),I=S.info,L=[];\nL.push('*تقرير فحص '+(I.pivot?'بيفوت '+I.pivot:'')+(I.farm?' - مزرعة '+I.farm:'')+'*');\nif(I.date)L.push(I.date);L.push(...infoLines());L.push('');\nL.push('*الفحص الخضري* (عينات: '+v.n+')');v.res.filter(o=>o.v!=null).forEach(o=>L.push('* '+o.name+' '+fmt(o.v)));L.push('');\nL.push('*فحص الدرنات* (عينات: '+t.n+' | درنات: '+t.T+')');t.res.filter(o=>o.v!=null).forEach(o=>L.push('* '+o.name+' '+fmt(o.v)));\nif(S.notes)L.push('','*ملاحظات:* '+S.notes);return L.join('\\n')}\n\nfunction waOpen(){window.open('https://wa.me/?text='+encodeURIComponent($('wa').value),'_blank')}\nasync function copyT(){const t=$('wa').value;try{await navigator.clipboard.writeText(t)}catch(e){$('wa').select();document.execCommand('copy')}alert('تم النسخ')}\nfunction shareT(){const t=$('wa').value;if(navigator.share)navigator.share({text:t}).catch(()=>{});else copyT()}\n\nfunction dl(name,data,type){TSDL(new Blob([data],{type}),name)}\nconst fn=()=>'تقرير_'+(S.info.pivot||'بيفوت')+'_'+(S.info.date||'');\nfunction sheet(sec){const d=S[sec],v=sec=='veg';\nreturn [[...(v?['المسافة']:[]),'الإجمالي',...d.cols],...d.rows.map(r=>[...(v?[r.dist]:[]),r.total,...d.cols.map((c,j)=>r.vals[j]??'')])]}\nfunction exX(){const wb=XLSX.utils.book_new(),v=calc('veg'),t=calc('tub');\nconst sum=[['البيانات',''],...F.map(([k,l])=>[l,S.info[k]]),[],['الفحص الخضري','%'],...v.res.map(o=>[o.name,o.v==null?'':+o.v.toFixed(2)]),[],['فحص الدرنات','%'],...t.res.map(o=>[o.name,o.v==null?'':+o.v.toFixed(2)]),[],['ملاحظات',S.notes]];\nXLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'ملخص');\nXLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sheet('veg')),'خضري');\nXLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sheet('tub')),'درنات');\nXLSX.writeFile(wb,fn()+'.xlsx')}\nfunction exC(){const q=a=>a.map(r=>r.map(x=>'\"'+String(x??'').replace(/\"/g,'\"\"')+'\"').join(',')).join('\\n');\ndl(fn()+'_خضري.csv','\\ufeff'+q(sheet('veg')),'text/csv');setTimeout(()=>dl(fn()+'_درنات.csv','\\ufeff'+q(sheet('tub')),'text/csv'),300)}\nfunction exJ(){dl(fn()+'.json',JSON.stringify(S,null,1),'application/json')}\nfunction exT(){dl(fn()+'.txt',mkText(),'text/plain')}\n\nfunction addRow(sec,o){const d=S[sec];const r=blank();r.dist=o.dist??'';r.total=o.total??'';\nObject.entries(o.map).forEach(([n,x])=>{let j=d.cols.findIndex(c=>c.trim()==n.trim());if(j<0){d.cols.push(n);j=d.cols.length-1}r.vals[j]=x});\nif(d.rows.length==1&&!d.rows[0].vals.some(x=>x!==''&&x!=null)&&d.rows[0].total===''&&d.rows[0].dist==='')d.rows=[];d.rows.push(r)}\nconst ad=s=>s.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));\nfunction impText(txt){txt=ad(txt||'');if(!txt.trim())return;let sec='veg',m={veg:{},tub:{}},got=0,I=S.info;\ntxt.split(/\\r?\\n/).forEach(raw=>{const l=raw.replace(/^[\\s*•\\-–]+/,'').replace(/\\*/g,'').trim();\nif(!l){if(Object.keys(m.veg).length)sec='tub';return}let x;\nif(x=l.match(/^بيفوت\\s*(\\S+)/)){I.pivot=x[1];return}if(x=l.match(/^مزرعة\\s*(.+)/)){I.farm=x[1].trim();return}\nif(x=l.match(/المساحة\\D*([\\d.]+)/)){I.area=x[1];return}if(x=l.match(/^الصنف\\s*[:\\-]?\\s*(.+)/)){I.variety=x[1].trim();return}\nif(x=l.match(/^العمر\\D*([\\d.]+)/)){I.age=x[1];return}if(x=l.match(/كفاءة العرش\\D*([\\d.]+)/)){I.canopy=x[1];return}if(x=l.match(/الصلابة\\D*([\\d.]+)/)){I.firm=x[1];return}\nif(x=l.match(/^قطر.*?([\\d.]+)/)){I.diam=x[1];return}\nif(x=l.match(/^(.+?)\\s*[:=]?\\s*(\\d+(?:[.,]\\d+)?)\\s*%/)){const n=x[1].replace(/[:\\-]+$/,'').trim(),p=x[2].replace(',','.');\nif(/درنات|جرب|اخضرار/.test(n)&&!/^من\\b/.test(n))sec='tub';m[sec][n]=p;got++}});\n['veg','tub'].forEach(s=>{if(Object.keys(m[s]).length)addRow(s,{total:100,map:m[s]})});\nsave();renderData();alert(got?'تم الاستيراد ('+got+' بند). النسب أُدخلت كعينة من 100.':'لم يتم العثور على بيانات')}\nfunction impFiles(fl){[...fl].forEach(f=>{const rd=new FileReader(),ext=f.name.split('.').pop().toLowerCase();\nif(ext=='txt'){rd.onload=()=>impText(rd.result);rd.readAsText(f)}\nelse if(ext=='json'){rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o.veg&&o.tub){S=Object.assign(fresh(),o);save();renderData()}else alert('ملف JSON غير مطابق')}catch(e){alert('ملف JSON غير صالح')}};rd.readAsText(f)}\nelse{\nrd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'});wb.SheetNames.forEach(sn=>{if(sn=='ملخص'){XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''}).forEach(r=>{const q=F.find(x=>x[1]===r[0]);if(q&&r[1]!=='')S.info[q[0]]=String(r[1])});return}\nconst sec=/درن|tub/i.test(sn+(wb.SheetNames.length==1?f.name:''))?'tub':'veg';\nconst A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});if(A.length<2)return;\nconst H=A[0].map(String);const ti=H.findIndex(h=>/إجمال|total|عدد/i.test(h)),di=H.findIndex(h=>/مساف|dist/i.test(h));\nA.slice(1).forEach(r=>{const map={};H.forEach((h,j)=>{if(j==ti||j==di||!h.trim()||/^#$|^م$/.test(h))return;if(r[j]!==''&&!isNaN(r[j]))map[h]=r[j]});\nif(Object.keys(map).length)addRow(sec,{dist:di>=0?r[di]:'',total:ti>=0?r[ti]:'',map})})});\nsave();renderData()}catch(e){alert('تعذر قر
